[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Sito migrato su Vercel: ogni URL netlify rimbalza sul dominio di produzione.
[[redirects]]
  from = "/*"
  to = "https://theblondesconcept.com/:splat"
  status = 301
  force = true
